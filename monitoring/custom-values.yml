# monitoring/custom-values.yaml

grafana:
  adminPassword: "trendify-admin" # Change this later
  
  # Expose Grafana using the AWS Load Balancer Controller
  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
      # Optional: Add this if you want to use a custom domain later
      # external-dns.alpha.kubernetes.io/hostname: grafana.trendify.com
    hosts:
      - "" # Leaving empty creates a wildcard ALB route for testing
      
prometheus:
  prometheusSpec:
    # Ensure Prometheus data survives pod restarts
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
          # EKS default storage class
          storageClassName: gp2 

# Disable default rules that are too noisy or irrelevant for your setup
defaultRules:
  create: true
  rules:
    kubeApiserverAvailability: false
    kubeApiserverBurnrate: false